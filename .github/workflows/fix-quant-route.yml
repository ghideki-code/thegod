name: Fix Quant Lab route

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout THEGOD
        uses: actions/checkout@v4

      - name: Fix frontend Quant Lab endpoint
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/QuantitativeLabPanel.tsx')
          s = p.read_text()
          old = '/api/quant/lab?symbol=BTC%2FUSDT&days=${days}'
          new = '/api/quant-lab?symbol=BTC%2FUSDT&days=${days}'
          if old not in s:
              raise SystemExit('Expected old Quant Lab route was not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit fix and remove one-shot workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-quant-route.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/QuantitativeLabPanel.tsx .github/workflows/fix-quant-route.yml
          git commit -m "fix: point Quant Lab panel to Vercel function"
          git push origin main
