name: Build and publish THEGOD frontend to Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout THEGOD
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Install Hugging Face Hub CLI
        run: python -m pip install --upgrade huggingface_hub

      - name: Publish prebuilt frontend
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf upload amdk62/thegod dist . --repo-type=space --commit-message "deploy: publish THEGOD frontend"
