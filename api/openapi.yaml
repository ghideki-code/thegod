openapi: 3.0.3
info:
  title: The God Trading API
  version: 1.0.0
  description: API contract for real-market analysis, signals, Quant Lab and paper trading. Real financial execution is intentionally excluded.
servers:
  - url: /api
paths:
  /market/candles/{symbol}:
    get:
      summary: Real market snapshot
      parameters:
        - $ref: '#/components/parameters/Symbol'
        - $ref: '#/components/parameters/Refresh'
      responses:
        '200': { description: Real OHLCV market snapshot }
        '400': { description: Invalid symbol }
        '502': { description: Market data provider failure }
  /market/analysis/{symbol}:
    get:
      summary: Quantitative market analysis
      parameters:
        - $ref: '#/components/parameters/Symbol'
        - $ref: '#/components/parameters/Refresh'
      responses:
        '200': { description: SMC, Wyckoff, Gann, divergence and indicator analysis }
        '400': { description: Invalid symbol }
        '502': { description: Analysis failure }
  /signal/{symbol}:
    get:
      summary: Generate quantitative trade signal
      parameters:
        - $ref: '#/components/parameters/Symbol'
        - name: riskPercent
          in: query
          schema: { type: number, default: 1 }
        - $ref: '#/components/parameters/Refresh'
      responses:
        '200': { description: Generated signal }
  /market/signals:
    get:
      summary: Current scanner signals
      responses:
        '200': { description: Current real-time scanner state }
  /market/refresh-prices:
    post:
      summary: Refresh real-time prices
      responses:
        '200': { description: Updated prices }
  /market/scan:
    post:
      summary: Run market scan
      responses:
        '200': { description: Completed quantitative scan }
  /ai-analysis:
    post:
      summary: Gemini quantitative analysis
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol: { type: string, example: BTC/USDT }
                riskPercent: { type: number, default: 1 }
      responses:
        '200': { description: AI analysis plus deterministic signal }
  /backtest:
    get:
      summary: Historical real-market backtest
      parameters:
        - $ref: '#/components/parameters/SymbolQuery'
        - name: days
          in: query
          schema: { type: integer, minimum: 7, maximum: 90, default: 60 }
      responses:
        '200': { description: Backtest metrics and trades }
  /quant/lab:
    get:
      summary: Quantitative Lab
      parameters:
        - $ref: '#/components/parameters/SymbolQuery'
        - name: days
          in: query
          schema: { type: integer, minimum: 7, maximum: 90, default: 30 }
      responses:
        '200': { description: Backtest, walk-forward, Monte Carlo and stress results }
  /quant/validate:
    get:
      summary: Out-of-sample parameter validation
      parameters:
        - $ref: '#/components/parameters/SymbolQuery'
        - name: days
          in: query
          schema: { type: integer, minimum: 90, maximum: 180, default: 180 }
        - name: trainPercent
          in: query
          schema: { type: number, minimum: 60, maximum: 80, default: 70 }
      responses:
        '200': { description: OOS validation, significance, overfitting and multi-regime results }
  /paper/status:
    get:
      summary: Paper trading status
      responses:
        '200': { description: Paper account and engine state }
  /paper/start:
    post:
      summary: Start paper trading
      responses:
        '200': { description: Paper engine started }
  /paper/stop:
    post:
      summary: Stop paper trading
      responses:
        '200': { description: Paper engine stopped }
  /paper/tick:
    post:
      summary: Execute one paper-trading cycle
      responses:
        '200': { description: Paper cycle completed }
        '502': { description: Paper cycle failure }
  /paper/reset:
    post:
      summary: Reset paper account
      responses:
        '200': { description: Paper state reset }
  /paper/close/{positionId}:
    post:
      summary: Close a paper position manually
      parameters:
        - name: positionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [price]
              properties:
                price: { type: number }
      responses:
        '200': { description: Paper position closed }
        '404': { description: Position not found or invalid price }
components:
  parameters:
    Symbol:
      name: symbol
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Z0-9]+/[A-Z0-9]+$' }
      example: BTC/USDT
    SymbolQuery:
      name: symbol
      in: query
      schema: { type: string, pattern: '^[A-Z0-9]+/[A-Z0-9]+$' }
      example: BTC/USDT
    Refresh:
      name: refresh
      in: query
      schema: { type: boolean, default: false }
